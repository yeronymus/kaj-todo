<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TickTick Clone pro KAJ předmět. To-Do list, Pomodoro, Habits a mnohem více." />
  <title>TickTick Clone | KAJ</title>
  
  <!-- Main CSS and JS -->
</head>
<body class="light-mode">
  
  <!-- Zde bude dynamicky vložena Webová komponenta pro detail úlohy -->
  <task-modal id="task-detail-modal" aria-hidden="true"></task-modal>

  <!-- Hlavní layout -->
  <div class="app-container">
    
    <!-- Sémantika: nav pro boční menu -->
    <nav class="sidebar" aria-label="Hlavní navigace">
      <div class="sidebar-header">
        <h1>TickTick</h1>
      </div>
      <ul class="sidebar-menu" id="main-nav">
        <li><a href="/" data-route="/">Inbox</a></li>
        <li><a href="/matrix" data-route="/matrix">Matrix</a></li>
        <li><a href="/habits" data-route="/habits">Habits</a></li>
      </ul>
      <div class="sidebar-footer">
        <button id="theme-toggle">Přepnout téma</button>
      </div>
    </nav>

    <!-- Sémantika: main pro hlavní obsah (zde se bude přepisovat router) -->
    <main class="main-content" id="router-view">
      <!-- Místo pro dynamický obsah (List/Matrix/Habits) -->
    </main>

    <!-- Sémantika: aside pro doplňkový obsah (např. Pomodoro widget) -->
    <aside class="right-panel">
      <!-- Pomodoro Timer Area -->
      <section class="pomodoro-widget">
        <h2>Pomodoro</h2>
        <div class="timer-container">
          <canvas id="pomodoro-canvas" width="200" height="200"></canvas>
          <div class="timer-text" id="pomodoro-time">25:00</div>
        </div>
        <div class="timer-controls">
          <button id="pomodoro-start">Start</button>
          <button id="pomodoro-pause">Pause</button>
        </div>
        <!-- Média API: audio prvek -->
        <audio id="pomodoro-audio" src="" preload="auto"></audio>
      </section>
    </aside>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
