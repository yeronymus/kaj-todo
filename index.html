<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TodoZen - A premium multi-dimensional To-Do, Pomodoro, and Habits application." />
  <title>TodoZen | KAJ Semestral Work</title>
</head>
<body class="light-mode">
  
  <!-- Web Component for task detail placeholder -->
  <task-modal id="task-detail-modal" aria-hidden="true"></task-modal>

  <!-- Main Layout -->
  <div class="app-container">
    
    <!-- Sidebar -->
    <nav class="sidebar" aria-label="Main Navigation">
      <div class="sidebar-header">
        <h1>TodoZen</h1>
      </div>
      <ul class="sidebar-menu" id="main-nav">
        <li><a href="/" data-route="/">Inbox</a></li>
        <li><a href="/matrix" data-route="/matrix">Matrix</a></li>
        <li><a href="/habits" data-route="/habits">Habits</a></li>
      </ul>
      <div class="sidebar-footer">
        <button id="theme-toggle">Toggle Theme</button>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content" id="router-view">
      <!-- Dynamic views render here -->
    </main>

    <!-- Right Widget Panel -->
    <aside class="right-panel">
      <!-- Pomodoro Timer Area -->
      <section class="pomodoro-widget">
        <h2>Pomodoro</h2>
        <div class="timer-container">
          <canvas id="pomodoro-canvas" width="200" height="200"></canvas>
          <div class="timer-text" id="pomodoro-time">25:00</div>
        </div>
        <div class="timer-controls">
          <button id="pomodoro-start">Start</button>
          <button id="pomodoro-pause">Pause</button>
        </div>
        <!-- Media API: audio element -->
        <audio id="pomodoro-audio" src="" preload="auto"></audio>
      </section>
    </aside>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
